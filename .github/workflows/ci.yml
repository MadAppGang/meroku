---
# Continuous integration for the two Go modules and the Terraform they wire
# together.
#
# This workflow exists because nothing ran any of it. `release.yml` was the only
# workflow in the repository, and it builds tags. `task test` runs `go test
# ./...` from `app/`, which is a different Go module and so never reaches
# `modules/workloads/ci_lambda`. `task lambda:test` exists and nothing invokes
# it. The entire Terraform <-> Go boundary check — the mechanism built to make
# the backend-deploy defect un-reintroducible — was therefore opt-in, which is
# the same property that let that defect survive for months while every unit
# test passed.
#
# No paths filter. A boundary test whose whole purpose is to catch a change on
# one side of a boundary must not be skipped because the change landed on the
# other side.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lower of the two modules' `go` directives (ci_lambda: 1.22,
  # app: 1.23.0), so both are built with a toolchain each accepts.
  GO_VERSION: '1.23'
  TERRAFORM_VERSION: '1.9.8'
  # Matches release.yml. The pnpm version is deliberately not pinned here — the
  # web job reads it from web/package.json's `packageManager` instead.
  NODE_VERSION: '20'

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            dir: app
          - module: ci_lambda
            dir: modules/workloads/ci_lambda
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # `gofmt -l` prints offending files and exits 0, so the exit code has to
      # be derived from the output.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # -count=1 defeats the test result cache; -race because the Lambda's
      # clients are built once at cold start and shared across invocations.
      - name: Test
        run: go test -race ./... -count=1

  terraform:
    name: Terraform (modules/workloads)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Repository-wide, with no exemptions.
      #
      # This was scoped to modules/workloads while two things blocked widening
      # it: twelve unformatted files across the other modules, and
      # project/env/dev/main.tf — a committed generated artifact so stale it was
      # syntactically invalid ("backend_remote_access = " with no value), which
      # made `terraform fmt -recursive .` fail to parse the repository rather
      # than report formatting.
      #
      # Both are gone. The artifact was deleted and env renders are gitignored
      # (they are build output), and every remaining file was reformatted rather
      # than excluded. Keep it that way: an exclusion here is how the drift came
      # back last time.
      - name: Format
        run: terraform fmt -check -recursive -diff .

      - name: Init
        run: terraform init -backend=false -input=false
        working-directory: modules/workloads

      - name: Validate
        run: terraform validate
        working-directory: modules/workloads

  # The drift check between the committed golden capture and the tf_identifiers
  # module. Separate from the `go` job because it is the one test that needs a
  # terraform binary; the always-on boundary test does not, which is what stops
  # it silently skipping on a machine without one.
  boundary-golden:
    name: Boundary golden drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: modules/workloads/ci_lambda/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check the golden capture against terraform
        run: go test -tags tfgolden ./internal/boundary/ -count=1
        working-directory: modules/workloads/ci_lambda

  # The web app was not compiled anywhere until a tag was pushed: release.yml ran
  # `pnpm build` and this workflow covered only Go and Terraform. So the first
  # signal that the frontend no longer compiled was a failed release, which is
  # exactly what happened to v4.0.0 — a type error in a component broke the
  # release build after the PR had already merged green.
  #
  # It runs `pnpm build`, the same script release.yml runs, rather than a
  # hand-rolled equivalent. That matters: `pnpm build` is `tsc -b && vite build`,
  # and `tsc -b` is stricter than the `tsc --noEmit -p tsconfig.json` you would
  # reach for by hand — the error that broke v4.0.0 passes the latter and fails
  # the former. Anything less than the real command reproduces the same gap in a
  # smaller form.
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version here on purpose: the action reads `packageManager` from the
      # package.json it is pointed at, so the pnpm version does not become a
      # third place to keep in sync.
      #
      # package_json_file is required. `defaults.run.working-directory` above
      # applies to `run` steps only, not to action inputs, so without this the
      # action looks in the repository root — which has no package.json — and
      # fails with "No pnpm version is specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile, matching release.yml: a lockfile that does not satisfy
      # package.json should fail here rather than resolve to something the
      # release will not reproduce.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Build only. `biome ci src` reports 40 errors on the tree as it stands —
      # 21 useButtonType, 12 noLabelWithoutControl, the rest a11y and unused
      # imports — none of them from this change. Gating on it would make every
      # PR red for reasons unrelated to itself, and the obvious sweep is not
      # safe: a <button> inside a form defaults to type="submit", so adding
      # type="button" to all 21 changes behaviour in whichever ones were
      # submitting. Clearing those is its own change with its own review, and
      # this step turns into `pnpm exec biome ci src` when it lands.
      - name: Build
        run: pnpm build
