name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # Job 1: Build web assets once (shared across all builds)
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Build web app
        run: cd web && pnpm build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: app/webapp/
          retention-days: 1

  # Job 2: Build Go binaries in parallel (one job per OS)
  build-binaries:
    name: Build ${{ matrix.goos }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: app/webapp/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd app

          # Run go mod tidy and generate
          go mod tidy
          go generate ./...

          mkdir -p dist

          # Build for each architecture
          for GOARCH in amd64 arm64; do
            # Skip unsupported combinations
            if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then
              echo "Skipping windows/arm64"
              continue
            fi

            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

            OUTPUT="dist/meroku_${GOOS}_${GOARCH}${EXT}"
            echo "Building $GOOS/$GOARCH -> $OUTPUT"

            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.version=$VERSION" -o "$OUTPUT" .

            # Create archive
            ARCHIVE_NAME="meroku_$(echo $GOOS | sed 's/darwin/Darwin/' | sed 's/linux/Linux/' | sed 's/windows/Windows/')_$(echo $GOARCH | sed 's/amd64/x86_64/' | sed 's/arm64/arm64/')"

            if [ "$GOOS" = "windows" ]; then
              # Create zip for Windows
              cd dist
              zip "${ARCHIVE_NAME}.zip" "meroku_${GOOS}_${GOARCH}${EXT}"
              cd ..
            else
              # Create tar.gz for Unix
              cd dist
              tar -czvf "${ARCHIVE_NAME}.tar.gz" "meroku_${GOOS}_${GOARCH}${EXT}"
              cd ..
            fi
          done

          ls -la dist/

      - name: Create Linux packages
        if: matrix.goos == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd app

          # Install nfpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

          # Create nfpm config for each arch
          for GOARCH in amd64 arm64; do
            ARCH_NAME=$(echo $GOARCH | sed 's/amd64/x86_64/' | sed 's/arm64/arm64/')

            cat > nfpm-${GOARCH}.yaml << EOF
          name: meroku
          arch: "${GOARCH}"
          platform: "linux"
          version: "${VERSION#v}"
          maintainer: "MadAppGang <i@madappgang.com>"
          description: "Easy infrastructure management"
          homepage: "https://madappgang.com"
          license: "MIT"
          contents:
            - src: ./dist/meroku_linux_${GOARCH}
              dst: /usr/bin/meroku
          depends:
            - git
          recommends:
            - terraform
          EOF

            # Create deb
            nfpm package -p deb -f nfpm-${GOARCH}.yaml -t "dist/meroku_Linux_${ARCH_NAME}.deb"

            # Create rpm
            nfpm package -p rpm -f nfpm-${GOARCH}.yaml -t "dist/meroku_Linux_${ARCH_NAME}.rpm"
          done

          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}
          path: app/dist/
          retention-days: 1

  # Job 3: Create release and upload all artifacts
  release:
    name: Create Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.deb *.rpm > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD | grep -v "^* Merge" | head -20)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -20 | grep -v "^* Merge")
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "## Changelog

          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Installation

          ### Homebrew (macOS/Linux)
          \`\`\`bash
          brew tap MadAppGang/tap
          brew install meroku
          \`\`\`

          ### Download
          Download the appropriate binary for your platform from the assets below.
          " \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.deb \
            dist/*.rpm \
            dist/checksums.txt

  # Job 4: Update Homebrew tap
  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          sleep 10  # wait for release assets to propagate

          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/checksums.txt" -o checksums.txt

          DARWIN_ARM64_SHA=$(grep "Darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')
          DARWIN_X64_SHA=$(grep "Darwin_x86_64.tar.gz" checksums.txt | awk '{print $1}')
          LINUX_ARM64_SHA=$(grep "Linux_arm64.tar.gz" checksums.txt | awk '{print $1}')
          LINUX_X64_SHA=$(grep "Linux_x86_64.tar.gz" checksums.txt | awk '{print $1}')

          echo "darwin_arm64_sha=$DARWIN_ARM64_SHA" >> $GITHUB_OUTPUT
          echo "darwin_x64_sha=$DARWIN_X64_SHA" >> $GITHUB_OUTPUT
          echo "linux_arm64_sha=$LINUX_ARM64_SHA" >> $GITHUB_OUTPUT
          echo "linux_x64_sha=$LINUX_X64_SHA" >> $GITHUB_OUTPUT

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: MadAppGang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/meroku.rb << EOF
          class Meroku < Formula
            desc "Easy infrastructure management"
            homepage "https://github.com/MadAppGang/meroku"
            version "${{ steps.release.outputs.version }}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/MadAppGang/meroku/releases/download/v${{ steps.release.outputs.version }}/meroku_Darwin_x86_64.tar.gz"
                sha256 "${{ steps.release.outputs.darwin_x64_sha }}"
              end
              on_arm do
                url "https://github.com/MadAppGang/meroku/releases/download/v${{ steps.release.outputs.version }}/meroku_Darwin_arm64.tar.gz"
                sha256 "${{ steps.release.outputs.darwin_arm64_sha }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/MadAppGang/meroku/releases/download/v${{ steps.release.outputs.version }}/meroku_Linux_x86_64.tar.gz"
                sha256 "${{ steps.release.outputs.linux_x64_sha }}"
              end
              on_arm do
                url "https://github.com/MadAppGang/meroku/releases/download/v${{ steps.release.outputs.version }}/meroku_Linux_arm64.tar.gz"
                sha256 "${{ steps.release.outputs.linux_arm64_sha }}"
              end
            end

            depends_on "terraform" => :optional
            depends_on "opentofu" => :optional

            def install
              bin.install Dir["meroku*"].first => "meroku"
            end

            test do
              assert_match "meroku", shell_output("#{bin}/meroku --version")
            end
          end
          EOF

      - name: Push to tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/meroku.rb
          git commit -m "Update meroku to v${{ steps.release.outputs.version }}"
          git push
