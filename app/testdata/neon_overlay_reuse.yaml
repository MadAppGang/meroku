# Neon in reuse mode, laid over project/dev.yaml for render tests.
#
# Merge rule: a mapping merges into the base key by key; any other value,
# lists included, replaces the base value. So `services` below is the whole
# list, and `workload` only adds backend_neon.
#
# Every id is a placeholder. No real project, organization or host.
neon:
  mode: reuse
  project_id: fake-project-000000
  pg_version: 17
  owner_role: neondb_owner
  databases:
    - name: app
      create: true
    - name: analytics
      create: false

workload:
  backend_neon:
    database: app
    schemas: [app, public]
    access: readwrite
    password_version: 1

services:
  - name: service1
    enabled: true
    auto_deploy: true
    container_port: 3000
    host_port: 3000
    cpu: 256
    memory: 512
    desired_count: 1
    runtime: fargate
    ecr_config:
      mode: create_ecr
    neon:
      database: analytics
      access: readonly
  - name: reports
    enabled: false
    container_port: 3000
    host_port: 3000
    cpu: 256
    memory: 512
    desired_count: 1
    runtime: fargate
    ecr_config:
      mode: create_ecr
    neon:
      database: app
      schemas: [reporting]
      access: readonly
