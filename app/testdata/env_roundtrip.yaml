schema_version: 32
project: myapp
env: dev
is_prod: false
auto_deploy: true
region: us-east-1
account_id: "000000000000"
aws_profile: myapp-dev
state_bucket: myapp-terraform-state-dev
state_file: state.tfstate
state_lock_table: myapp-terraform-locks-dev
use_default_vpc: false
vpc_cidr: 10.20.0.0/16
ecr_strategy: local
workload:
  backend_health_endpoint: ""
  backend_external_docker_image: ""
  bucket_postfix: ""
  bucket_public: false
  backend_image_port: 8080
  backend_remote_access: false
  setup_fcnsns: false
  xray_enabled: false
  backend_env_variables:
    BACKEND_TEST: passed
  policies: []
  backend_policies:
  - actions:
    - dynamodb:GetItem
    resources:
    - arn:aws:dynamodb:us-east-1:000000000000:table/example
  env_files_s3: []
  slack_webhook: ""
  enable_github_oidc: false
  github_oidc_subjects: []
  install_pg_admin: false
  pg_admin_email: ""
  backend_alb_domain_name: ""
  backend_desired_count: 2
  backend_autoscaling_enabled: true
  backend_autoscaling_min_capacity: 2
  backend_autoscaling_max_capacity: 10
  backend_autoscaling_target_cpu: 55
  backend_autoscaling_target_memory: 65
  backend_cpu: "512"
  backend_memory: "1024"
  backend_runtime: fargate
  backend_auto_deploy: true
  backend_health_check:
    command: curl -fsS http://localhost:8080/health
    interval: 30
    timeout: 5
    retries: 3
    start_period: 60
  backend_circuit_breaker:
    enable: true
    rollback: true
  policy:
  - effect: Allow
    actions:
    - s3:GetObject
    resources:
    - arn:aws:s3:::myapp-backend-dev/*
  - effect: Deny
    actions:
    - s3:DeleteObject
    resources:
    - arn:aws:s3:::myapp-backend-dev/*
    conditions:
    - test: StringNotEquals
      variable: aws:RequestedRegion
      values:
      - us-east-1
  efs:
  - name: uploads
    mount_point: /data
    read_only: true
  vaults:
  - name: shared
  events:
    subscribes:
    - detail_type: order.created
    queue:
      visibility_timeout: 60
    produces:
    - detail_types:
      - user.created
domain:
  enabled: true
  create_domain_zone: false
  domain_name: example.com
  is_dns_root: false
  dns_root_account_id: ""
  delegation_role_arn: ""
postgres:
  enabled: true
  dbname: myapp
  username: dbadmin
  public_access: false
  engine_version: "14"
  aurora: true
  min_capacity: 0
  max_capacity: 1
  instance_class: ""
  allocated_storage: 0
  storage_type: ""
  multi_az: false
  storage_encrypted: true
  deletion_protection: false
  skip_final_snapshot: true
  iam_database_authentication_enabled: false
cognito:
  enabled: true
  enable_web_client: false
  enable_dashboard_client: false
  dashboard_callback_urls:
  - https://jwt.io
  enable_user_pool_domain: false
  user_pool_domain_prefix: ""
  backend_confirm_signup: false
  auto_verified_attributes:
  - email
ses:
  enabled: true
  test_emails:
  - ops@example.com
sqs:
  enabled: false
  name: default-queue
alb:
  enabled: true
scheduled_tasks:
- name: cleanup
  enabled: true
  auto_deploy: true
  schedule: rate(1 hours)
  docker_image: ""
  container_command: []
  environment_variables:
    TASK_STAGE: nightly
  ecr_config:
    mode: create_ecr
  policy:
  - effect: Allow
    actions:
    - s3:ListBucket
    resources:
    - arn:aws:s3:::myapp-backend-dev
  vaults:
  - name: shared
  events:
    produces:
    - any: true
      own_source_only: false
      bus: default
event_processor_tasks:
- name: deployment-events
  enabled: true
  rules:
  - name: hug_all
    sources:
    - service1
    detail_types:
    - SERVICE_DEPLOYMENT_COMPLETED
    bus: default
  environment_variables:
    TASK_STAGE: events
  ecr_config:
    mode: create_ecr
  policy:
  - effect: Deny
    actions:
    - sqs:DeleteQueue
    resources:
    - arn:aws:sqs:us-east-1:000000000000:example
    conditions:
    - test: Bool
      variable: aws:SecureTransport
      values:
      - "false"
  vaults:
  - name: payments
    access: read_write
pubsub_appsync:
  enabled: false
  schema: false
  auth_lambda: false
  resolvers: false
  auth_mode: lambda
  api_key_enabled: false
  jwks_uri: ""
  jwt_issuer: ""
  jwt_audience: ""
efs:
- name: shared
- name: uploads
  uid: 0
  gid: 0
  permissions: "770"
  path: /uploads
buckets:
- name: uploads
  public: false
  versioning: true
  cors_rules:
  - allowed_headers:
    - '*'
    allowed_methods:
    - GET
    - PUT
    allowed_origins:
    - https://app.example.com
    expose_headers: []
    max_age_seconds: 300
services:
- name: service1
  enabled: true
  auto_deploy: true
  docker_image: ""
  container_command: []
  container_port: 3000
  host_port: 3000
  cpu: 256
  memory: 512
  desired_count: 3
  remote_access: true
  xray_enabled: false
  essential: false
  env_vars:
    SERVICE_TEST: PASSED
  env_variables: []
  env_files_s3: []
  ecr_config:
    mode: create_ecr
  runtime: fargate
  health_check_command: wget -qO- http://localhost:3000/health
  policy:
  - effect: Allow
    actions:
    - ses:SendEmail
    resources:
    - '*'
  vaults:
  - name: shared
    access: read
  - name: payments
    access: read_write
    prefix: PAY
  events:
    subscribes:
    - detail_type: payment.completed
      source: example.payments
    - name: users
      detail_type_prefix: user.
      bus: default
    queue:
      visibility_timeout: 30
      max_receive_count: 5
    produces:
    - detail_types:
      - order.created
      - order.cancelled
      own_source_only: true
amplify_apps:
- name: main-web
  github_repository: https://github.com/example-org/example-repo
  branches:
  - name: main
    stage: PRODUCTION
    enable_auto_build: true
    environment_variables:
      REACT_APP_ENV: production
  - name: develop
    stage: DEVELOPMENT
    enable_pull_request_preview: true
    environment_variables:
      REACT_APP_ENV: development
  subdomain_prefix: app.example.com
  custom_rules:
  - source: /api/<*>
    workload: backend
  - source: /r/<*>
    workload: reports
    path: /<*>
  - source: /old-pricing
    target: /pricing
    status: "301"
data_bucket:
  shared:
  - name: uploads
    read_write:
    - service1
    - backend
    read:
    - cleanup
vaults:
- name: shared
- name: payments
event_bus:
  enabled: true
valkey:
  enabled: true
  engine_version: "8"
  max_storage_gb: 2
  access:
  - service1
  - cleanup
