schema_version: 33
project: myapp
env: dev
region: ap-southeast-2
account_id: "000000000000"
aws_profile: none
use_default_vpc: false
event_bus: { enabled: true }
workload:
  backend_image_port: 8080
event_processor_tasks:
  - name: mailer
    rules:
      - { name: r1, sources: [myapp.orders], detail_types: [order.created] }
      - { name: r2, sources: [aws.ecs], detail_types: [ECS Task State Change], bus: default }
      - { name: r3, sources: [myapp.billing], detail_types: [invoice.paid], bus: project }
  - name: legacy
    rule_name: legacy_rule
    sources: [myapp.backend]
    detail_types: [user.created]
