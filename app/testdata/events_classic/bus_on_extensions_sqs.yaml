schema_version: 33
project: myapp
env: dev
region: ap-southeast-2
account_id: "000000000000"
aws_profile: none
use_default_vpc: false
event_bus: { enabled: true }
workload:
  backend_image_port: 8080
  events:
    subscribes:
      - { detail_type: order.created }
extensions:
  sqs_queues:
    - { name: jobs, add_to_backend_env: JOBS_QUEUE_URL, dlq_enabled: true }
    - { name: ordered, fifo: true }
