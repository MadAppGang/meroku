schema_version: 33
project: myapp
env: dev
region: ap-southeast-2
account_id: "000000000000"
aws_profile: none
use_default_vpc: false
event_bus: { enabled: true }
workload:
  backend_image_port: 8080
  events:
    produces:
      - { detail_types: [order.created, order.cancelled] }
      - { any: true, bus: default }
services:
  - name: orders
    container_port: 3000
    events:
      produces:
        - { detail_types: ["order.*"], own_source_only: false }
        - { detail_types: [order.shipped], bus: project }
scheduled_tasks:
  - name: nightly
    schedule: rate(1 day)
    events:
      produces:
        - { detail_types: [report.ready] }
event_processor_tasks:
  - name: mailer
    rules:
      - { name: r1, sources: [myapp.orders], detail_types: [order.created] }
    events:
      produces:
        - { detail_types: [mail.sent] }
