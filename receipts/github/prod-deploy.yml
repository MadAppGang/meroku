---
name: Deploy to Production Amazon ECS

on:
  workflow_dispatch: # Add this line to enable manual triggering

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "000000000000"
  # Role name follows pattern: {project}-{env}-github-actions-role
  PROJECT: your-project
  ENV: prod

permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-${{ env.ENV }}-github-actions-role
          role-session-name: samplerolesession
          aws-region: ${{ env.AWS_REGION }}
      # `project` and `env` are what scope the deploy. Without them the CI Lambda
      # can only fall back to the event source, and every project in the account
      # that accepts "action.production" redeploys its own backend.
      - name: Trigger deployment via EventBridge
        run: |
          aws events put-events --entries \
            'Source=action.${{ env.ENV }},DetailType=DEPLOY,Detail="{\"service\":\"backend\",\"project\":\"${{ env.PROJECT }}\",\"env\":\"${{ env.ENV }}\"}",EventBusName=default'