version: '3'

vars:
  APP_DIR: ./app
  WEB_DIR: ./web
  LAMBDA_DIR: ./modules/workloads/ci_lambda

tasks:
  # ─── Development ────────────────────────────────────────
  tui:
    desc: "Run the TUI app (usage: task tui -- path/to/project)"
    deps: [build]
    cmd: cd {{.CLI_ARGS | default "."}} && {{.ROOT_DIR}}/meroku
    vars:
      ROOT_DIR:
        sh: pwd

  web:
    desc: Run the web frontend dev server
    dir: '{{.WEB_DIR}}'
    cmd: pnpm run dev

  build:
    desc: Build the CLI binary
    dir: '{{.APP_DIR}}'
    cmd: go build -o ../meroku .

  test:
    desc: Run Go tests
    dir: '{{.APP_DIR}}'
    cmd: go test ./...

  test:web:
    desc: Run web frontend tests
    dir: '{{.WEB_DIR}}'
    cmd: pnpm run test

  generate:
    desc: Generate code from templates
    dir: '{{.APP_DIR}}'
    cmd: go generate ./...

  lint:web:
    desc: Lint web frontend
    dir: '{{.WEB_DIR}}'
    cmd: pnpm exec biome check .

  # ─── Web Build ──────────────────────────────────────────
  web:build:
    desc: Build web frontend into app/webapp (embedded in Go binary)
    dir: '{{.WEB_DIR}}'
    cmd: pnpm run build

  # ─── Infrastructure (run from a project directory) ──────
  infra-gen-dev:
    desc: Generate Terraform files for dev environment
    dir: '{{.APP_DIR}}'
    cmd: go run . template -c vars=dev.yaml -f ./infrastructure/env/main.hbs -o ./env/dev/main.tf

  infra-gen-prod:
    desc: Generate Terraform files for prod environment
    dir: '{{.APP_DIR}}'
    cmd: go run . template -c vars=prod.yaml -f ./infrastructure/env/main.hbs -o ./env/prod/main.tf

  infra-init:
    desc: Initialize Terraform
    dir: project/env/{{.env}}
    cmd: terraform init
    requires:
      vars: [env]

  infra-plan:
    desc: Plan infrastructure changes
    dir: project/env/{{.env}}
    cmd: terraform plan
    requires:
      vars: [env]

  infra-apply:
    desc: Apply infrastructure changes
    dir: project/env/{{.env}}
    cmd: terraform apply
    requires:
      vars: [env]

  infra-destroy:
    desc: Destroy infrastructure
    dir: project/env/{{.env}}
    cmd: terraform destroy
    requires:
      vars: [env]

  infra-show:
    desc: Show current infrastructure state
    dir: project/env/{{.env}}
    cmd: terraform show
    requires:
      vars: [env]

  infra-update:
    desc: Update Terraform modules
    dir: project
    cmd: |
      rm -rf ./infrastructure
      git clone --depth=1 --branch=main https://github.com/MadAppGang/infrastructure.git ./infrastructure
      rm -rf ./infrastructure/.git
    requires:
      vars: [env]

  infra-import:
    desc: Import existing AWS resources
    dir: project/env/{{.env}}
    cmd: terraform import
    requires:
      vars: [env]

  # ─── CI Lambda ──────────────────────────────────────────
  # Nothing here is needed to deploy. modules/workloads/lambda.tf builds and zips
  # the artifact itself at apply time (null_resource.build_ci_lambda), per
  # environment, into .build/<env>/. These targets exist to reproduce that build
  # locally — same GOOS/GOARCH/flags and the same output paths, so what you
  # inspect is what terraform would ship. Keep them in step with
  # local.ci_lambda_build_command in lambda.tf.
  lambda:build:
    desc: "Build the CI Lambda exactly as terraform does (usage: task lambda:build env=dev)"
    dir: '{{.LAMBDA_DIR}}'
    cmds:
      - mkdir -p .build/{{.env}}
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o .build/{{.env}}/bootstrap .
    requires:
      vars: [env]

  lambda:test:
    desc: Run Lambda unit tests
    dir: '{{.LAMBDA_DIR}}'
    cmd: go test -v ./...

  lambda:test:golden:
    desc: Drift-check the Terraform→Go boundary golden file (needs terraform; add -- -update to rewrite it)
    dir: '{{.LAMBDA_DIR}}'
    cmd: go test -tags tfgolden ./internal/boundary/ -count=1 {{.CLI_ARGS}}

  lambda:package:
    desc: "Zip the built binary as terraform does (usage: task lambda:package env=dev)"
    dir: '{{.LAMBDA_DIR}}'
    deps: [lambda:build]
    cmd: go run ./tools/mkzip -in .build/{{.env}}/bootstrap -out .build/{{.env}}/ci_lambda.zip
    requires:
      vars: [env]

  lambda:clean:
    desc: Remove every locally built Lambda artifact
    dir: '{{.LAMBDA_DIR}}'
    cmd: rm -rf .build bootstrap ci_lambda.zip

  # ─── CI ─────────────────────────────────────────────────
  # Local mirror of .github/workflows/ci.yml. `task test` only covers the app
  # module; the Lambda is a separate Go module and was reached by nothing.
  ci:
    desc: Run everything CI runs (both Go modules + Terraform)
    cmds:
      - task: ci:go
        vars: {DIR: '{{.APP_DIR}}'}
      - task: ci:go
        vars: {DIR: '{{.LAMBDA_DIR}}'}
      - task: ci:terraform

  ci:go:
    internal: true
    dir: '{{.DIR}}'
    cmds:
      - go build ./...
      - go vet ./...
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go test -race ./... -count=1

  ci:terraform:
    internal: true
    cmds:
      - terraform fmt -check -recursive -diff modules/workloads
      - terraform -chdir=modules/workloads init -backend=false -input=false
      - terraform -chdir=modules/workloads validate

  # ─── Release ────────────────────────────────────────────
  version:
    desc: Show current version
    cmd: cat ./version.txt

  renderdiff:
    desc: Test terraform plan diff viewer
    dir: '{{.APP_DIR}}'
    cmd: go run . --renderdiff {{.file}}
    requires:
      vars: [file]
